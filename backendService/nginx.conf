server {
    listen 80;
    server_name api.gettradiehub.com;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}


server {
    listen 443 ssl;
    http2 on;
    server_name api.gettradiehub.com;
    ssl_certificate     /etc/letsencrypt/live/api.gettradiehub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.gettradiehub.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;


    
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    location / {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend:5002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;


        
    }
    location /api/v1/webhook/stripe {
        proxy_pass http://backend:5002;
        proxy_set_header HOST $host;
        proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        
    }
}